<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- 小电视避雷针 logo：小电视 + 避雷针天线 + 闪电；主色 B 站蓝 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33BCEF"/>
      <stop offset="1" stop-color="#007CB5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="300" height="300" rx="64" fill="url(#bg)"/>
  <!-- 两根避雷针天线（杆顶圆球） -->
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M106 116 L80 56"/>
    <path d="M194 116 L220 56"/>
  </g>
  <circle cx="78" cy="50" r="9" fill="#FFFFFF"/>
  <circle cx="222" cy="50" r="9" fill="#FFFFFF"/>
  <!-- 电视机身与双脚 -->
  <rect x="48" y="104" width="204" height="136" rx="26" fill="#FFFFFF"/>
  <rect x="76" y="238" width="28" height="12" rx="6" fill="#FFFFFF"/>
  <rect x="196" y="238" width="28" height="12" rx="6" fill="#FFFFFF"/>
  <!-- 屏幕 -->
  <rect x="64" y="120" width="172" height="104" rx="16" fill="#0072A8"/>
  <!-- 闪电 -->
  <polygon points="166,126 118,180 146,180 134,218 182,162 154,162 170,126"
           fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
</svg>
